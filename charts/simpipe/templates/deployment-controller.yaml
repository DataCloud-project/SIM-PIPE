apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simpipeController.fullname" . }}
  labels:
    {{- include "simpipeController.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "simpipeController.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "simpipeController.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.controller.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "simpipeController.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- if .Values.controller.virtualization.enabled }}
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
            {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            {{- end }}
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "simpipeController.fullname" . }}
                  key: minioAccessKey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "simpipeController.fullname" . }}
                  key: minioSecretKey
            {{- if .Values.controller.keycloak.oauth2IssuerEndpoint }}
            - name: OAUTH2_ISSUER_ENDPOINT
              value: {{ .Values.controller.keycloak.oauth2IssuerEndpoint | quote }}
            {{- end }}
            - name: MINIO_PUBLIC_URL
              value: {{ .Values.controller.minio.publicUrl | quote }}
            - name: MINIO_INTERNAL_URL
              value: {{ tpl .Values.controller.minio.internalUrl . | quote }}
            - name: MINIO_BUCKET_NAME
              value: {{ .Values.controller.minio.bucketName | quote }}
            - name: MINIO_REGION
              value: {{ .Values.controller.minio.region | quote }}
            - name: ARGO_CLIENT_ENDPOINT
              value: {{ .Values.controller.argo.endpoint | quote }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROMETHEUS_SERVER_URL
              value: {{ .Values.controller.prometheus.serverUrl | quote }}
            - name: CARBONTRACKER_ENDPOINT
              value: {{ .Values.controller.carbontracker.endpoint | quote }}
            - name: MOOSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: simpipe-moose-api
                  key: MOOSE_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: simpipe-openrouter-api
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: INLUMEN_CLIENT_ID
              value: {{ .Values.controller.inlumen.clientId | default "" | quote }}
            - name: INLUMEN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: simpipe-inlumen
                  key: INLUMEN_CLIENT_SECRET
                  optional: true
            - name: INLUMEN_ENDPOINT
              value: {{ .Values.controller.inlumen.endpoint | default "http://localhost:5002" | quote }}
            - name: INLUMEN_LLM_PROVIDER
              value: {{ .Values.controller.inlumen.llmProvider | default "" | quote }}
            - name: INLUMEN_LLM_MODEL
              value: {{ .Values.controller.inlumen.llmModel | default "" | quote }}
            - name: INLUMEN_LLM_BASE_URL
              value: {{ .Values.controller.inlumen.llmBaseUrl | default "" | quote }}
            - name: INLUMEN_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: simpipe-inlumen-llm
                  key: INLUMEN_LLM_API_KEY
                  optional: true
            - name: NODE_ENV
              value: development
            - name: VIRTUALIZATION_ENABLED
              value: {{ .Values.controller.virtualization.enabled | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.controller.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if .Values.controller.virtualization.enabled }}
          volumeMounts:
            - name: host-tmp-vm
              mountPath: /host-tmp-vm
            - name: kvm
              mountPath: /dev/kvm
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          {{- end }}
      {{- if .Values.controller.virtualization.enabled }}
      volumes:
        - name: host-tmp-vm
          hostPath:
            path: /tmp/vm-files
            type: DirectoryOrCreate
        - name: kvm
          hostPath:
            path: /dev/kvm
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
