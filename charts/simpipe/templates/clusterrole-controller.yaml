{{- if and .Values.controller.clusterRole.create .Values.controller.virtualization.enabled }}
# Defines a ClusterRole to grant cluster-scoped permissions for simpipe-controller.
# Only created when virtualization is enabled — the controller does not call
# listNode() when virtualization is disabled, so no ClusterRole is needed.
# Set controller.clusterRole.create=false if the cluster admin pre-creates this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "simpipeController.serviceAccountName" . }}-controller-clusterrole
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
{{- if .Values.controller.virtualization.enabled }}
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["delete", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["pods/eviction"]
  verbs: ["create"]
{{- end }}
{{- end }}
