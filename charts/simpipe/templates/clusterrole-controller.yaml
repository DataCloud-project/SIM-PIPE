# Defines a ClusterRole to grant cluster-scoped permissions for simpipe-controller.
# nodes read access is always required: resources() lists nodes unconditionally to
# reconcile VMNode CRD status even when QEMU virtualization is disabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "simpipeController.serviceAccountName" . }}-controller-clusterrole
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
{{- if .Values.controller.virtualization.enabled }}
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["delete", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["pods/eviction"]
  verbs: ["create"]
{{- end }}
