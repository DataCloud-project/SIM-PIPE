{{- if and .Values.controller.clusterRole.create .Values.controller.virtualization.enabled }}
# Binds the ClusterRole to the simpipe-controller service account for cluster-scoped access.
# Only created when virtualization is enabled (mirrors clusterrole-controller.yaml condition).
# Set controller.clusterRole.create=false if the cluster admin pre-creates this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "simpipeController.serviceAccountName" . }}-controller-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "simpipeController.serviceAccountName" . }}-controller-clusterrole
subjects:
- kind: ServiceAccount
  name: {{ include "simpipeController.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
